# AuraFinance — Render Deployment Configuration
# -----------------------------------------------
# Defines both services in one file.
# Run: render blueprint sync  (or connect repo in Render Dashboard)

services:

  # ─── 1. BACKEND — Express Node.js Web Service ───────────────────────────────
  - type: web
    name: aurafinance-backend
    runtime: node
    region: oregon           # Change to: frankfurt, singapore, ohio as needed
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: PORT
        value: 10000          # Render sets this automatically; keep in sync
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false           # You will paste your MongoDB Atlas URI in Render dashboard
      - key: FRONTEND_URL
        sync: false           # You will paste your Render frontend URL after it deploys

  # ─── 2. FRONTEND — React Vite Static Site ────────────────────────────────────
  - type: web
    name: aurafinance-frontend
    runtime: static
    region: oregon
    plan: free
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        sync: false           # You will paste your Render backend URL (e.g. https://aurafinance-backend.onrender.com)
    routes:
      - type: rewrite
        source: /*
        destination: /index.html  # Required for React SPA client-side routing
